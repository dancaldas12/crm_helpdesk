services:
  # ----------------------------------------------------------------------------
  # Base de Datos Relacional: MySQL 8
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: crm-helpdesk-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: ${DB_NAME:-serviclient}
      MYSQL_USER: ${DB_USER:-serviclient_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-serviclient_pass}
      TZ: ${TZ:-America/Lima}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - crm-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # Aplicación Monolítica: ServiClient CRM Helpdesk (Spring Boot 3 + Java 21)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crm-helpdesk-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-mysql}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-serviclient}
      DB_USER: ${DB_USER:-serviclient_user}
      DB_PASSWORD: ${DB_PASSWORD:-serviclient_pass}
      TZ: ${TZ:-America/Lima}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - crm-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  # SonarQube es opcional: iniciar con `docker compose --profile sonar up -d`.
  sonar-db:
    image: postgres:17-alpine
    container_name: crm-helpdesk-sonar-db
    profiles: ["sonar"]
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar_local_password}
      POSTGRES_DB: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - crm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:26.11.0.134175-community
    container_name: crm-helpdesk-sonarqube
    profiles: ["sonar"]
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar_local_password}
    ports:
      - "${SONAR_PORT:-9000}:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions
      - sonar_logs:/opt/sonarqube/logs
    networks:
      - crm-network

# ------------------------------------------------------------------------------
# Red interna aislada para comunicación inter-contenedores
# ------------------------------------------------------------------------------
networks:
  crm-network:
    name: crm_helpdesk_network
    driver: bridge

# ------------------------------------------------------------------------------
# Volumen persistente para datos de MySQL
# ------------------------------------------------------------------------------
volumes:
  mysql_data:
    name: crm_helpdesk_mysql_data
  sonar_db_data:
    name: crm_helpdesk_sonar_db_data
  sonar_data:
    name: crm_helpdesk_sonar_data
  sonar_extensions:
    name: crm_helpdesk_sonar_extensions
  sonar_logs:
    name: crm_helpdesk_sonar_logs


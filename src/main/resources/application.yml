spring:
  application:
    name: crm-helpdesk
  profiles:
    active: mysql
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    com.serviclient: INFO
    org.springframework.security: INFO

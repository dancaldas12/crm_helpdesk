<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout/base :: layout('Nuevo Cliente', 'clientes', ~{::section})}">
<head>
    <title>Nuevo Cliente - ServiClient</title>
</head>
<body>
    <section>
        <div class="page-header-row">
            <div class="page-title-group">
                <h1>Registrar Nuevo Cliente</h1>
                <p>Ingresa la información comercial y de contacto de la cuenta.</p>
            </div>
            <div>
                <a th:href="@{/clientes}" class="btn btn-secondary">Volver al listado</a>
            </div>
        </div>

        <div class="table-card" style="max-width: 800px; padding: 32px; margin: 0 auto;">
            <form th:action="@{/clientes}" th:object="${clienteDto}" method="post">
                <div class="form-row-2">
                    <div class="form-group">
                        <label class="form-label">Nombre Comercial *</label>
                        <input type="text" th:field="*{nombreComercial}" class="form-input" placeholder="Ej. NovaTech Solutions" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Razón Social</label>
                        <input type="text" th:field="*{razonSocial}" class="form-input" placeholder="Ej. NovaTech Solutions S.A.">
                    </div>
                </div>

                <div class="form-row-2">
                    <div class="form-group">
                        <label class="form-label">RUC / Identificación Fiscal</label>
                        <input type="text" th:field="*{ruc}" class="form-input" placeholder="20123456789">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Responsable Asignado</label>
                        <select th:field="*{responsableId}" class="form-select">
                            <option value="">Seleccionar agente / responsable</option>
                            <option th:each="u : ${usuarios}" th:value="${u.id}" th:text="${u.nombreCompleto + ' (' + u.rol.descripcion + ')'}"></option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Servicio Contratado *</label>
                    <input type="text" th:field="*{servicioContratado}" class="form-input" placeholder="Ej. SaaS Enterprise, Licencia Standard, etc." required>
                </div>

                <div class="form-row-2">
                    <div class="form-group">
                        <label class="form-label">Fecha de Inicio *</label>
                        <input type="date" th:field="*{fechaInicio}" class="form-input" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Fecha de Renovación *</label>
                        <input type="date" th:field="*{fechaRenovacion}" class="form-input" required>
                    </div>
                </div>

                <div style="margin: 28px 0 16px 0; border-top: 1px solid var(--color-border-light); padding-top: 20px;">
                    <h3 style="font-size: 15px; font-weight: 700; color: var(--color-text-main); margin-bottom: 16px;">Contacto Principal (Opcional)</h3>
                    <div class="form-row-2">
                        <div class="form-group">
                            <label class="form-label">Nombre del Contacto</label>
                            <input type="text" th:field="*{contactoNombre}" class="form-input" placeholder="Ej. Laura Méndez">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Cargo</label>
                            <input type="text" th:field="*{contactoCargo}" class="form-input" placeholder="Ej. Directora TI">
                        </div>
                    </div>
                    <div class="form-row-2">
                        <div class="form-group">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" th:field="*{contactoEmail}" class="form-input" placeholder="laura@cliente.com">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Teléfono</label>
                            <input type="text" th:field="*{contactoTelefono}" class="form-input" placeholder="+51 999 888 777">
                        </div>
                    </div>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
                    <a th:href="@{/clientes}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary" style="padding: 10px 28px;">Guardar Cliente</button>
                </div>
            </form>
        </div>
    </section>
</body>
</html>

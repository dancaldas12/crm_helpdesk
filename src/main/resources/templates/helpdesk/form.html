<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout/base :: layout('Nuevo Ticket', 'tickets', ~{::section})}">
<head>
    <title>Nuevo Ticket - ServiClient</title>
</head>
<body>
    <section>
        <div class="page-header-row">
            <div class="page-title-group">
                <h1>Crear Nuevo Ticket</h1>
                <p>Registra una nueva incidencia o solicitud de servicio.</p>
            </div>
            <div>
                <a th:href="@{/tickets}" class="btn btn-secondary">Volver a Mesa de Ayuda</a>
            </div>
        </div>

        <div class="table-card" style="max-width: 800px; padding: 32px; margin: 0 auto;">
            <form th:action="@{/tickets}" th:object="${ticketDto}" method="post">
                <div class="form-group">
                    <label class="form-label">Cliente *</label>
                    <select th:field="*{clienteId}" class="form-select" required>
                        <option value="">Seleccionar cliente</option>
                        <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombreComercial}"></option>
                    </select>
                </div>

                <div class="form-row-2">
                    <div class="form-group">
                        <label class="form-label">Categoría *</label>
                        <select th:field="*{categoria}" class="form-select">
                            <option th:each="cat : ${categorias}" th:value="${cat}" th:text="${cat.etiqueta}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Prioridad *</label>
                        <select th:field="*{prioridad}" class="form-select">
                            <option th:each="pri : ${prioridades}" th:value="${pri}" th:text="${pri.etiqueta}"></option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Agente Asignado (Opcional)</label>
                    <select th:field="*{agenteId}" class="form-select">
                        <option value="">Sin asignar (Auto-asignación)</option>
                        <option th:each="ag : ${agentes}" th:value="${ag.id}" th:text="${ag.nombreCompleto}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Asunto del Ticket *</label>
                    <input type="text" th:field="*{asunto}" class="form-input" placeholder="Ej. Caída de API de integración" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Descripción Detallada *</label>
                    <textarea th:field="*{descripcion}" class="form-textarea" rows="5" placeholder="Detalles de la incidencia, pasos para reproducir o solicitud..." required></textarea>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px;">
                    <a th:href="@{/tickets}" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-primary" style="padding: 10px 28px;">Crear Ticket</button>
                </div>
            </form>
        </div>
    </section>
</body>
</html>

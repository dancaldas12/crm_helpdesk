<div xmlns:th="http://www.thymeleaf.org" th:fragment="miCuenta" id="miCuentaModal"
    class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
    <div class="bg-white rounded-3xl shadow-2xl border border-slate-100 max-w-lg w-full p-6 sm:p-7 relative">

        <!-- Header con icono y boton X -->
        <div class="flex items-center justify-between pb-4 border-b border-slate-100">
            <div class="flex items-center gap-2.5">
                <div
                    class="w-9 h-9 rounded-xl bg-purple-50 text-indigo-600 flex items-center justify-center text-sm shadow-sm">
                    <i class="fa-regular fa-user"></i>
                </div>
                <h3 class="text-base font-bold text-slate-900">Mi cuenta</h3>
            </div>
            <button type="button" id="closeMiCuentaModalBtn"
                class="text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center transition">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>

        <!-- Tarjeta Perfil Superior -->
        <div class="mt-5 p-4 rounded-2xl bg-slate-50/80 border border-slate-100 flex items-center gap-3.5">
            <div class="w-12 h-12 rounded-full bg-indigo-600 text-white font-bold text-sm flex items-center justify-center flex-shrink-0 shadow-sm"
                th:text="${usuarioIniciales}">LM</div>
            <div class="overflow-hidden space-y-0.5">
                <div class="flex items-center gap-2">
                    <span class="text-sm font-bold text-slate-900 truncate" th:text="${usuarioNombre}">Laura
                        Méndez</span>
                    <span
                        class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-purple-50 text-indigo-600 border border-indigo-100">Cliente</span>
                </div>
                <p class="text-xs text-slate-500 truncate" th:text="${usuarioEmail}">laura@novatech.com</p>
                <p class="text-[11px] text-slate-400 flex items-center gap-1.5 pt-0.5">
                    <i class="fa-solid fa-building text-[10px]"></i>
                    <span th:text="${empresaNombre}">NovaTech Industries</span>
                    <span>•</span>
                    <span>Plan Enterprise</span>
                </p>
            </div>
        </div>

        <!-- Formulario / Datos del Perfil -->
        <div class="mt-5 space-y-4 text-xs">
            <!-- Nombre Completo -->
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Nombre
                    Completo</label>
                <input type="text" readonly th:value="${usuarioNombre}"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-slate-800 font-semibold focus:outline-none">
            </div>

            <!-- Correo Electrónico -->
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1.5">Correo
                    Electrónico</label>
                <input type="text" readonly th:value="${usuarioEmail}"
                    class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-slate-800 font-semibold focus:outline-none">
            </div>

            <!-- Fila Empresa y Usuario/ID -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Empresa</label>
                        <span class="text-[10px] text-slate-400 flex items-center gap-1">
                            <i class="fa-solid fa-lock text-[9px]"></i> Solo lectura
                        </span>
                    </div>
                    <input type="text" readonly th:value="${empresaNombre}"
                        class="w-full px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-slate-700 font-medium truncate focus:outline-none">
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="text-[10px] font-bold uppercase tracking-wider text-slate-500">Usuario /
                            ID</label>
                        <span class="text-[10px] text-slate-400 flex items-center gap-1">
                            <i class="fa-solid fa-lock text-[9px]"></i> Solo lectura
                        </span>
                    </div>
                    <input type="text" readonly
                        th:value="${#strings.contains(usuarioEmail, '@') ? #strings.substringBefore(usuarioEmail, '@') : usuarioEmail}"
                        class="w-full px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 text-slate-700 font-medium truncate focus:outline-none uppercase">
                </div>
            </div>
        </div>

        <!-- Botones de Acción Inferiores -->
        <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between">
            <button type="button" id="switchToPasswordModalBtn"
                class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl border border-slate-200 hover:border-slate-300 text-slate-700 font-semibold text-xs hover:bg-slate-50 transition">
                <i class="fa-solid fa-rotate text-xs text-slate-400"></i>
                <span>Cambiar contraseña</span>
            </button>
            <button type="button" id="closeMiCuentaFooterBtn"
                class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs shadow-md shadow-indigo-600/20 transition">
                Cerrar
            </button>
        </div>

    </div>
</div>

<!-- ========================================================================= -->
<!-- MODAL FLOTANTE: CAMBIAR CONTRASEÑA -->
<!-- ========================================================================= -->
<div xmlns:th="http://www.thymeleaf.org" th:fragment="cambiarPassword" id="passwordModal"
    class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
    <div class="bg-white rounded-3xl shadow-2xl border border-slate-100 max-w-md w-full p-6 sm:p-8 relative">

        <button type="button" id="closePasswordModalBtn"
            class="absolute top-5 right-5 text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full hover:bg-slate-100 flex items-center justify-center transition">
            <i class="fa-solid fa-xmark text-sm"></i>
        </button>

        <div class="flex items-center gap-3.5 mb-5">
            <div
                class="w-11 h-11 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg flex-shrink-0">
                <i class="fa-solid fa-key"></i>
            </div>
            <div>
                <h3 class="text-base font-bold text-slate-900">Cambiar Contraseña</h3>
                <p class="text-xs text-slate-500">Actualiza tus credenciales de acceso al portal.</p>
            </div>
        </div>

        <!-- Alertas Flash -->
        <div th:if="${modalPasswordError}"
            class="mb-4 p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation text-rose-500"></i>
            <span th:text="${modalPasswordError}"></span>
        </div>
        <div th:if="${modalPasswordExito}"
            class="mb-4 p-3 rounded-xl bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs font-semibold flex items-center gap-2">
            <i class="fa-solid fa-circle-check text-emerald-500"></i>
            <span th:text="${modalPasswordExito}"></span>
        </div>

        <form th:action="@{/portal/cambiar-password-modal}" method="post" class="space-y-4">
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-700 mb-1">Contraseña
                    Actual</label>
                <input type="password" name="passwordActual" required
                    class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 transition">
            </div>

            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-700 mb-1">Nueva
                    Contraseña</label>
                <input type="password" name="nuevaPassword" minlength="8" required
                    class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 transition">
                <p class="text-[10px] text-slate-400 mt-1">Mínimo 8 caracteres.</p>
            </div>

            <div>
                <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-700 mb-1">Confirmar
                    Nueva Contraseña</label>
                <input type="password" name="confirmarPassword" minlength="8" required
                    class="w-full px-3.5 py-2 text-xs rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-600 focus:ring-2 focus:ring-indigo-100 transition">
            </div>

            <div class="pt-3 flex justify-end gap-2.5">
                <button type="button" id="cancelPasswordModalBtn"
                    class="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 font-semibold text-xs transition">
                    Cancelar
                </button>
                <button type="submit"
                    class="px-5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs shadow-md shadow-indigo-600/20 transition">
                    Guardar
                </button>
            </div>
        </form>
    </div>
</div>

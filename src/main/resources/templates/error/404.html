<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Página no encontrada | ServiClient</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .error-container {
            width: 100%;
            max-width: 520px;
            text-align: center;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            padding: 48px 40px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        .logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 14px;
            background: #6366f1;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.25);
        }

        .error-code {
            font-size: 72px;
            line-height: 1;
            font-weight: 900;
            color: #6366f1;
            margin-bottom: 16px;
            letter-spacing: -2px;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #1e293b;
        }

        p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .btn-primary {
            background: #6366f1;
            color: #ffffff;
            border: 1px solid #6366f1;
        }

        .btn-primary:hover {
            background: #4f46e5;
            border-color: #4f46e5;
            transform: translateY(-1px);
        }

        .btn-secondary {
            border: 1px solid #cbd5e1;
            color: #334155;
            background: #ffffff;
        }

        .btn-secondary:hover {
            background: #f8fafc;
            border-color: #94a3b8;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="logo">S</div>

        <div class="error-code">404</div>

        <h1>Página no encontrada</h1>

        <p>El recurso que intentas consultar no existe, fue movido o no tienes permisos para visualizarlo.</p>

        <div class="actions">
            <th:block sec:authorize="hasAnyRole('ADMIN', 'AGENTE', 'SUPERVISOR')">
                <a th:href="@{/dashboard}" class="btn btn-primary">Ir al Dashboard</a>
                <a th:href="@{/clientes}" class="btn btn-secondary">Ver clientes</a>
            </th:block>

            <th:block sec:authorize="hasAnyRole('CLIENTE', 'CONTACTO', 'PORTAL')">
                <a th:href="@{/portal/mis-tickets}" class="btn btn-primary">Ir a Mis Tickets</a>
            </th:block>

            <th:block sec:authorize="!isAuthenticated()">
                <a th:href="@{/login}" class="btn btn-primary">Ir al Inicio</a>
            </th:block>
        </div>
    </div>
</body>

</html>
